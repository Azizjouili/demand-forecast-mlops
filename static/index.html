<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>demand-forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1413; --panel:#111b19; --panel-2:#16221f; --line:#223029;
    --fg:#e9f1ee; --muted:#93a59f; --faint:#64756f;
    --accent:#3cc2ad; --accent-ink:#8fe6d7; --accent-deep:#0f6b5e;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(1000px 500px at 85% -10%, rgba(60,194,173,.10), transparent 60%),
      var(--bg);
    color:var(--fg);font-family:var(--sans);line-height:1.55;padding:0 16px}
  .wrap{max-width:760px;margin:0 auto;padding:36px 0 60px}
  .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
    display:grid;place-items:center;font-weight:800;color:#05221d;font-size:19px;margin-bottom:16px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 4px}
  .sub a{color:var(--accent-ink);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
  @media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
  .field label{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);margin:0 0 5px}
  .field input,.field select{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--accent-deep)}
  .row{display:flex;gap:10px;align-items:center;margin-top:20px}
  button{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#05221d;border:none;
    font-weight:700;font-size:14.5px;padding:12px 24px;border-radius:12px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .out{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:13px;padding:18px 20px;display:none;align-items:baseline;gap:14px}
  .out .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
  .out .v{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .out .u{color:var(--muted);font-size:14px}
  .foot{margin-top:26px;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">d</div>
  <h1>demand-forecast</h1>
  <p class="sub">LightGBM bike-rental demand model, served from the MLflow registry (<span class="mono">@production</span>).</p>
  <p class="sub"><a href="https://github.com/Azizjouili/demand-forecast-mlops" target="_blank" rel="noopener">GitHub</a></p>

  <div class="grid">
    <div class="field"><label>Season (1-4)</label><input id="season" type="number" value="1" min="1" max="4"></div>
    <div class="field"><label>Year (0=2011,1=2012)</label><input id="yr" type="number" value="1" min="0" max="1"></div>
    <div class="field"><label>Month (1-12)</label><input id="mnth" type="number" value="1" min="1" max="12"></div>
    <div class="field"><label>Hour (0-23)</label><input id="hr" type="number" value="8" min="0" max="23"></div>
    <div class="field"><label>Holiday (0/1)</label><input id="holiday" type="number" value="0" min="0" max="1"></div>
    <div class="field"><label>Weekday (0-6)</label><input id="weekday" type="number" value="1" min="0" max="6"></div>
    <div class="field"><label>Working day (0/1)</label><input id="workingday" type="number" value="1" min="0" max="1"></div>
    <div class="field"><label>Weather (1-4)</label><input id="weathersit" type="number" value="1" min="1" max="4"></div>
    <div class="field"><label>Temp (0-1)</label><input id="temp" type="number" value="0.24" min="0" max="1" step="0.01"></div>
    <div class="field"><label>Feels-like (0-1)</label><input id="atemp" type="number" value="0.28" min="0" max="1" step="0.01"></div>
    <div class="field"><label>Humidity (0-1)</label><input id="hum" type="number" value="0.60" min="0" max="1" step="0.01"></div>
    <div class="field"><label>Windspeed (0-1)</label><input id="windspeed" type="number" value="0.15" min="0" max="1" step="0.01"></div>
  </div>

  <div class="row">
    <button id="go">Predict demand</button>
  </div>

  <div class="out" id="out">
    <span class="k">Predicted</span>
    <span class="v" id="val">—</span>
    <span class="u">rentals this hour</span>
  </div>
  <p class="foot">Model loaded by alias from MLflow &mdash; retraining swaps the served model with no code change.</p>
</div>

<script>
const FIELDS=["season","yr","mnth","hr","holiday","weekday","workingday","weathersit","temp","atemp","hum","windspeed"];
const go=document.getElementById("go"),out=document.getElementById("out"),val=document.getElementById("val");
go.onclick=async()=>{
  const body={};
  for(const f of FIELDS) body[f]=Number(document.getElementById(f).value);
  go.disabled=true; out.style.display="flex"; val.textContent="…";
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){ val.textContent="error"; console.error(await r.text()); }
    else { const j=await r.json(); val.textContent=Math.round(j.predicted_count); }
  }catch(e){ val.textContent="error"; console.error(e); }
  finally{ go.disabled=false; }
};
</script>
</body>
</html>
