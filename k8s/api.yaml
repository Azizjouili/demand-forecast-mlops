apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demand
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: demand-forecast-mlops:local
          imagePullPolicy: Never
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demand
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000